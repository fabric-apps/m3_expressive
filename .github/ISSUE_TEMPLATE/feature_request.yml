name: Feature request
description: Propose a new component or parameter.
labels: [enhancement]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Related component
      options:
        - M3LoadingIndicator
        - M3RefreshIndicator
        - M3DismissibleListItem
        - M3UndoPill
        - DraggableContainerButton / openContainerTransform
        - New component
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about?
