name: Bug report
description: Report a reproducible defect.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: "3.22.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - M3LoadingIndicator
        - M3RefreshIndicator
        - M3DismissibleListItem
        - M3UndoPill
        - DraggableContainerButton / openContainerTransform
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest possible code that reproduces the issue.
      render: dart
    validations:
      required: true
  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace
      description: Paste the full stack trace if one is present.
      render: text
