name: m3_expressive
description: Material 3 Expressive components for Flutter. Morphing shapes, animated indicators, swipe-to-dismiss list items, and container transforms faithful to the Android 16 design spec.
version: 1.0.0
publish_to: none
homepage: https://github.com/fabric-apps/m3_expressive
repository: https://github.com/fabric-apps/m3_expressive
issue_tracker: https://github.com/fabric-apps/m3_expressive/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  material_shapes:
    git:
      url: https://github.com/ksokolovskyi/material_shapes.git
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
